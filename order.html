<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogtooth order form</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: cyan;
            color: #263238;
            font-family: Arial, sans-serif;
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            padding: 22px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 0 12px;
            color: #174a7e;
            font-size: 24px;
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1b1b1b, #5e5e5e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.5rem;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd3d8;
            border-radius: 6px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        input:focus,
        select:focus {
            outline: 2px solid #87ceeb;
            border-color: #174a7e;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #174a7e;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #10395f;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1><span class="logo">D</span> Dogtooth order form</h1>

        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="address">Delivery address</label>
            <input type="text" id="address" name="address" autocomplete="street-address" required>

            <label for="pizza">Choose a pizza</label>
            <select id="pizza" name="pizza" required>
                <option value="" disabled selected>Select a pizza</option>
                <option value="margherita">Margherita</option>
                <option value="pepperoni">Pepperoni</option>
                <option value="vegetarian">Vegetarian</option>
                <option value="hawaiian">Hawaiian</option>
            </select>

            <label for="drink">Choose a drink</label>
            <select id="drink" name="drink" required>
                <option value="" disabled selected>Select a drink</option>
                <option value="water">Water</option>
                <option value="cola">Cola</option>
                <option value="lemonade">Lemonade</option>
                <option value="orange-juice">Orange juice</option>
            </select>

            <button type="submit">Place order</button>
        </form>
    </main>
</body>
</html>
