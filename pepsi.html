<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pepsi</title>
  <style>
    body {
      margin: 0;
      background-color: lightblue;
      font-family: Arial, sans-serif;
      text-align: center;

    }

    .card {
      max-width: 700px;
      margin: 20px auto;

      background: crimson;
      color: white;
      box-shadow: 0 14px 32px rgba(0,0,0,0.12);

    .title {

      gap: 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0 0 10px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1b1b1b, #5e5e5e);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin: 18px 0 10px;
      color: #123b71;
      font-weight: bold;
      text-decoration: underline;
    }

    .drink-photo {
      width: 100%;
      max-width: 500px;
      height: 260px;
      margin: 18px auto 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8fd3ff, #1f5bdb);
      border: 3px solid rgba(255,255,255,0.7);

</html>
